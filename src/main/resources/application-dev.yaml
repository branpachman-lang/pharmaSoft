server:
  port: 8080
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
    username: pharmaDB
    password: 123456
  flyway:
    # En esta base de clase V2__seguridad.sql ya se ejecuto manualmente.
    # Habilitar Flyway solo al preparar una base nueva sin esas tablas.
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
logging:
  level:
    root: INFO
    pe.com.upeu.PharmaBackend: DEBUG
# JWT de clase: en produccion el secreto llega por variable de entorno.
